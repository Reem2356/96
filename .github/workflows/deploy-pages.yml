name: نشر الموقع على GitHub Pages

on:
  push:
    branches:
      - claude/eloquent-carson-e63l3l
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # لا نمرر VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY هنا عمدًا: Vite
      # يقرأهما مباشرة من .env.production المحفوظ في المستودع. تمريرهما
      # كمتغيرات بيئة فارغة هنا (لو ما أُضيفا كأسرار GitHub) كان يطغى على
      # قيم .env.production الصحيحة ويجبر البناء على العودة لوضع Mock —
      # هذا بالضبط سبب ظهور بيانات تجريبية بدل الاتصال الحقيقي بـ Supabase.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
